name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # -----------------------------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # HOST PYTHON
      # -----------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------------------------------------------------
      # SYSTEM DEPENDENCIES
      # -----------------------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # -----------------------------------------------------------------------
      # JAVA 17
      # -----------------------------------------------------------------------

      - name: Set Java 17
        run: |
          JAVA_HOME_PATH="/usr/lib/jvm/temurin-17-jdk-amd64"

          if [ ! -d "$JAVA_HOME_PATH" ]; then
            JAVA_HOME_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          fi

          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_PATH/bin" >> "$GITHUB_PATH"

          java -version
          javac -version

      # -----------------------------------------------------------------------
      # PYTHON BUILD TOOLS
      # -----------------------------------------------------------------------

      - name: Upgrade Python build tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      # -----------------------------------------------------------------------
      # BUILDozer
      # -----------------------------------------------------------------------

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade buildozer

      - name: Verify Buildozer
        run: |
          python --version
          pip --version
          buildozer --version

      # -----------------------------------------------------------------------
      # VERIFY PROJECT
      # -----------------------------------------------------------------------

      - name: Verify project files
        run: |
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            ! -path "./.buildozer/*" \
            | sort

          echo ""
          echo "========================================"
          echo "BUILDOZER REQUIREMENTS"
          echo "========================================"

          grep "^requirements" buildozer.spec

          echo ""
          echo "========================================"
          echo "ANDROID SETTINGS"
          echo "========================================"

          grep "^android.api" buildozer.spec || true
          grep "^android.minapi" buildozer.spec || true
          grep "^android.ndk" buildozer.spec || true
          grep "^android.archs" buildozer.spec || true

          echo ""
          echo "========================================"
          echo "ASSETS"
          echo "========================================"

          find .assets -maxdepth 1 -type f | sort

      # -----------------------------------------------------------------------
      # CLEAN EVERYTHING FROM PREVIOUS BUILDS
      # -----------------------------------------------------------------------

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      # -----------------------------------------------------------------------
      # BUILD
      # -----------------------------------------------------------------------

      - name: Build APK
        env:
          # Do not allow interactive prerequisite questions.
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

        run: |
          yes | buildozer -v android debug

      # -----------------------------------------------------------------------
      # SHOW APK
      # -----------------------------------------------------------------------

      - name: Show APK output
        if: always()
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" -print
          else
            echo "bin directory does not exist."
          fi

      # -----------------------------------------------------------------------
      # UPLOAD APK
      # -----------------------------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mario-Game-APK
          path: bin/*.apk
          if-no-files-found: error
