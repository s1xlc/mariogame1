name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------
      # 1. Download the GitHub repository
      # --------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Set up Python
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # --------------------------------
      # 3. Install Linux dependencies
      # --------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-dev \
            python3-venv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            liblzma-dev


      # --------------------------------
      # 4. Set Java 17
      # --------------------------------
      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH

          java -version
          javac -version


      # --------------------------------
      # 5. Install Cython and Buildozer
      #
      # IMPORTANT:
      # Do NOT use a virtual environment.
      # Buildozer/python-for-android uses pip --user
      # internally, which fails inside a venv.
      # --------------------------------
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install --user \
            "cython==0.29.36" \
            buildozer \
            "pydantic<2"

          echo "$HOME/.local/bin" >> $GITHUB_PATH


      # --------------------------------
      # 6. Verify installation
      # --------------------------------
      - name: Check build tools
        run: |
          python --version
          cython --version
          buildozer --version
          which python
          which cython
          which buildozer


      # --------------------------------
      # 7. Build APK
      # --------------------------------
      - name: Build Android APK
        run: |
          buildozer -v android debug


      # --------------------------------
      # 8. Upload APK
      # --------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mario-Game-APK
          path: bin/*.apk
