name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout project
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ------------------------------------------------------------
      # SYSTEM DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------

      - name: Configure Java 17
        run: |
          if [ -d "/usr/lib/jvm/temurin-17-jdk-amd64" ]; then
            JAVA_HOME_PATH="/usr/lib/jvm/temurin-17-jdk-amd64"
          else
            JAVA_HOME_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          fi

          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_PATH/bin" >> "$GITHUB_PATH"

          java -version
          javac -version

      # ------------------------------------------------------------
      # PYTHON BUILD TOOLS
      # ------------------------------------------------------------

      - name: Install Python tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      # ------------------------------------------------------------
      # BUILDOZER
      # ------------------------------------------------------------

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade buildozer

      - name: Verify Buildozer
        run: |
          python --version
          pip --version
          buildozer --version

      # ------------------------------------------------------------
      # VERIFY ORIGINAL ASSETS
      # ------------------------------------------------------------

      - name: Verify original assets
        run: |
          echo "========================================"
          echo "ORIGINAL .assets CONTENT"
          echo "========================================"

          find .assets -maxdepth 1 -type f | sort

      # ------------------------------------------------------------
      # COPY ASSETS TO APP ROOT
      # ------------------------------------------------------------

      - name: Prepare game assets
        run: |
          echo "========================================"
          echo "COPYING GAME ASSETS"
          echo "========================================"

          # Copy the ORIGINAL files from .assets into the same directory
          # as main.py.
          #
          # This matches the paths used by main.py:
          # mario.png
          # mushroom.png
          # turtle.png
          # 5boss.png
          # background.jpg
          # bgmusic.mp3
          # etc.

          cp -a .assets/. .

          echo ""
          echo "========================================"
          echo "ROOT ASSETS AFTER COPY"
          echo "========================================"

          ls -lah \
            mario.png \
            mariocrouch.png \
            mushroom.png \
            turtle.png \
            5boss.png \
            background.jpg \
            bgmusic.mp3

          echo ""
          echo "========================================"
          echo "SOUND FILES"
          echo "========================================"

          ls -lah *.wav *.mp3 2>/dev/null || true

      # ------------------------------------------------------------
      # VERIFY CRITICAL FILES
      # ------------------------------------------------------------

      - name: Verify critical game files
        run: |
          set -e

          test -f main.py
          test -f mario.png
          test -f mariocrouch.png
          test -f mushroom.png
          test -f turtle.png
          test -f 5boss.png
          test -f background.jpg
          test -f bgmusic.mp3

          echo "All critical Mario Game assets are present."

      # ------------------------------------------------------------
      # CLEAN PREVIOUS BUILD
      # ------------------------------------------------------------

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ------------------------------------------------------------
      # BUILD APK
      # ------------------------------------------------------------

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      # ------------------------------------------------------------
      # CHECK APK
      # ------------------------------------------------------------

      - name: Show APK output
        if: always()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" -print
          else
            echo "No bin directory found."
          fi

      # ------------------------------------------------------------
      # UPLOAD APK
      # ------------------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mario-Game-APK
          path: bin/*.apk
          if-no-files-found: error
