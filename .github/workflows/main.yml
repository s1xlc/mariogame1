name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-dev \
            python3-venv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            liblzma-dev


      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH

          java -version
          javac -version


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install --user \
            "cython==0.29.36" \
            buildozer \
            "pydantic<2"

          echo "$HOME/.local/bin" >> $GITHUB_PATH


      - name: Check Buildozer
        run: |
          python --version
          cython --version
          buildozer --version


      # IMPORTANT:
      # Accept Android SDK licenses before Buildozer starts.
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true


      # Install the SDK components Buildozer needs.
      - name: Install Android SDK components
        run: |
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0"


      # Remove any previous Buildozer cache.
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      - name: Build Android APK
        run: |
          buildozer -v android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mario-Game-APK
          path: bin/*.apk
