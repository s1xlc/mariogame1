name: Build Android APK[cite: 7]

on:
  push:
    branches:
      - main[cite: 7]
  workflow_dispatch:[cite: 7]

jobs:
  build:
    runs-on: ubuntu-22.04[cite: 7]

    steps:
      - name: Checkout code[cite: 7]
        uses: actions/checkout@v4[cite: 7]

      - name: Set up Python[cite: 7]
        uses: actions/setup-python@v5[cite: 7]
        with:
          python-version: "3.10"[cite: 7]

      - name: Install system dependencies[cite: 7]
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            anticons \
            libstdc++6:i386 \
            zlib1g:i386

      - name: Set Java 17[cite: 7]
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          java -version
          javac -version

      - name: Upgrade Python build tools[cite: 7]
        run: |
          python -m pip install --upgrade pip setuptools wheel cython==0.30.11

      - name: Install Buildozer[cite: 7]
        run: |
          python -m pip install --upgrade buildozer

      - name: Verify build environment[cite: 7]
        run: |
          python --version
          pip --version
          buildozer --version

      - name: Check project files[cite: 7]
        run: |
          echo "=== Project files ==="
          find . -maxdepth 2 -type f | sort

          echo "=== Buildozer requirements ==="
          grep "^requirements" buildozer.spec || true

      - name: Clean old Buildozer files[cite: 7]
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK[cite: 7]
        run: |
          yes | buildozer -v android debug

      - name: Show APK files[cite: 7]
        if: always()
        run: |
          echo "=== APK output ==="
          find bin -maxdepth 1 -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK[cite: 7]
        if: success()
        uses: actions/upload-artifact@v4[cite: 7]
        with:
          name: Mario-Game-APK[cite: 7]
          path: bin/*.apk[cite: 7]
          if-no-files-found: error[cite: 7]
