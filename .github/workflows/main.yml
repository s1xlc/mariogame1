name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # -----------------------------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------------------------

      - name: Checkout project
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # HOST PYTHON
      # -----------------------------------------------------------------------

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------------------------------------------------
      # SYSTEM PACKAGES
      # -----------------------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # -----------------------------------------------------------------------
      # JAVA 17
      # -----------------------------------------------------------------------

      - name: Configure Java 17
        run: |
          if [ -d "/usr/lib/jvm/temurin-17-jdk-amd64" ]; then
            JAVA_HOME_PATH="/usr/lib/jvm/temurin-17-jdk-amd64"
          else
            JAVA_HOME_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          fi

          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_PATH/bin" >> "$GITHUB_PATH"

          java -version
          javac -version

      # -----------------------------------------------------------------------
      # PYTHON TOOLS
      # -----------------------------------------------------------------------

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      # -----------------------------------------------------------------------
      # BUILDOZER
      # -----------------------------------------------------------------------

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade buildozer

      - name: Verify Buildozer
        run: |
          python --version
          pip --version
          buildozer --version

      # -----------------------------------------------------------------------
      # VERIFY PROJECT
      # -----------------------------------------------------------------------

      - name: Verify project
        run: |
          echo "========================================"
          echo "BUILDOZER REQUIREMENTS"
          echo "========================================"

          grep "^requirements" buildozer.spec

          echo ""
          echo "========================================"
          echo "P4A VERSION"
          echo "========================================"

          grep "^p4a.branch" buildozer.spec
          grep "^p4a.commit" buildozer.spec

          echo ""
          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          grep "^android.api" buildozer.spec
          grep "^android.minapi" buildozer.spec
          grep "^android.ndk" buildozer.spec
          grep "^android.archs" buildozer.spec

          echo ""
          echo "========================================"
          echo "ORIGINAL ASSETS"
          echo "========================================"

          find .assets -maxdepth 1 -type f | sort

      # -----------------------------------------------------------------------
      # PREPARE ASSETS
      # -----------------------------------------------------------------------

      - name: Prepare Android assets
        run: |
          rm -rf android_assets
          mkdir -p android_assets

          cp -a .assets/. android_assets/

          echo "========================================"
          echo "PACKAGED ASSETS"
          echo "========================================"

          find android_assets -maxdepth 1 -type f | sort

      # -----------------------------------------------------------------------
      # CLEAN PREVIOUS BUILDS
      # -----------------------------------------------------------------------

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      # -----------------------------------------------------------------------
      # BUILD
      # -----------------------------------------------------------------------

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      # -----------------------------------------------------------------------
      # SHOW APK
      # -----------------------------------------------------------------------

      - name: Show APK output
        if: always()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" -print
          else
            echo "No APK output directory."
          fi

      # -----------------------------------------------------------------------
      # UPLOAD APK
      # -----------------------------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mario-Game-APK
          path: bin/*.apk
          if-no-files-found: error
